      homeInfoParams:
        Title: "About Me"
        Content: |
          I work in computational neuroscience and neural engineering at the **Tsinghua Neural Engineering Lab**. My research connects three scales:

          **Science.** I ask how limited and biased neural observations can reveal the dynamical structure and mechanistic organisation of neural population activity, including epilepsy, movement and value-based decision-making.

          **Engineering.** I integrate MRI, CT, DWI, EEG, SEEG and ECoG within a shared individualised brain space, with the longer-term goal of supporting virtual interventions such as stimulation, resection and tract disconnection.

          **Computation.** I combine neural dynamical equations, structural priors and machine learning so that models can learn missing structure from data while making their uncertainty and scope explicit.

          [Read more about how I approach research →](/about/research/)
