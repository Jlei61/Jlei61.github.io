      homeInfoParams:
        Title: "关于我"
        Content: |
          我在**清华大学神经工程实验室**从事计算神经科学与神经工程研究。我的工作围绕三个相互连接的尺度展开：

          **科学上，** 我关注如何从有限、带偏的神经观测中，恢复神经群体活动背后的动力学结构与机制解释，例如癫痫、运动和价值决策。

          **工程上，** 我尝试将 MRI、CT、DWI、EEG、SEEG 和 ECoG 等多模态信息整合进统一的个体化脑空间，并进一步支持刺激、切除和纤维离断等虚拟干预。

          **计算上，** 我研究如何把神经动力学方程、结构先验与机器学习结合，使模型既能从数据中学习未知结构，也能清楚表达自身的不确定性和适用边界。

          [进一步了解我的研究思路 →](/zh/about/research/)
