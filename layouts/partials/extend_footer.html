{{- if .IsPage }}
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
</script>
<script defer src="{{ "vendor/mathjax/tex-chtml.js" | relURL }}"></script>
{{- end }}
